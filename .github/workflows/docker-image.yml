name: 构建并推送 Docker 镜像

# 什么时候跑：
#   · 推送到 main        → 产出 latest + sha-xxxxxxx
#   · 打 v1.0.0 这类 tag → 产出 v1.0.0（+ latest 若在默认分支）
#   · 手动点按钮         → 同 main
#
# 推到哪：
#   · ghcr.io/<owner>/<repo>        —— 始终推（用 GITHUB_TOKEN，无需额外配置）
#   · docker.io/<user>/cc-ledger    —— 仅当仓库配了下面两个 secret 时才推：
#         Settings → Secrets and variables → Actions → New repository secret
#           DOCKERHUB_USERNAME = Docker Hub 用户名
#           DOCKERHUB_TOKEN    = Docker Hub 的 Access Token（Read & Write）
#     没配就自动跳过，不会报错。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 未配置时为空串 → 只推 ghcr，行为和以前完全一致
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # ghcr 的路径只接受小写：SheaYi/cc-ledger → shayi/cc-ledger
      # Docker Hub 用户名同样要小写（大写会被 registry 拒）
      - name: 计算镜像名
        id: img
        run: |
          IMAGES="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            IMAGES="${IMAGES},${DOCKERHUB_USERNAME,,}/cc-ledger"
          fi
          echo "images=${IMAGES}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_NAME=${IMAGES}" >> "$GITHUB_ENV"
          echo "目标仓库：${IMAGES}"

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub（配了 secret 才跑）
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.images }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short,prefix=sha-

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          # NAS 是 x86_64（Pentium Gold 8505），只出 amd64。
          # 加 arm64 会让 better-sqlite3 走 QEMU 模拟编译，构建时间翻几倍。
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 关掉 provenance：否则 manifest 里多一个 unknown 平台，
          # 部分 NAS 的 Docker 版本 pull 时会报 platform 不匹配。
          provenance: false

      - name: 输出镜像地址
        run: |
          echo "### 镜像已推送" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.meta.outputs.tags }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> 未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，本次只推了 ghcr。" >> "$GITHUB_STEP_SUMMARY"
          fi
